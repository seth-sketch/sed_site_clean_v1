<script>
document.addEventListener("DOMContentLoaded", function () {
  var $flip = $("#flipbook");

  // Make sure jQuery + turn.js are loaded
  if (typeof jQuery === "undefined") {
    console.warn("jQuery not loaded");
    return;
  }
  if (typeof $flip.turn !== "function") {
    console.warn("turn.js not loaded");
    return;
  }

  // ==== INIT FLIPBOOK ====
  $flip.turn({
    width: 1400,          // wider book for true landscape
    height: 600,          // shorter, cinematic ratio
    autoCenter: true,
    display: "double",    // open book layout
    acceleration: true,
    gradients: true,
    elevation: 50
  });

  // ==== CLICK-TO-TURN (MUCH BETTER UX) ====
  $flip.on("click", function (e) {
    var offset = $flip.offset();
    var x = e.pageX - offset.left;
    var w = $flip.width();

    if (x < w / 2) {
      $flip.turn("previous");
    } else {
      $flip.turn("next");
    }
  });

  // ==== ALLOW LEFT/RIGHT ARROW KEYS TOO ====
  $(document).keydown(function (e) {
    if (e.key === "ArrowLeft") {
      $flip.turn("previous");
    }
    if (e.key === "ArrowRight") {
      $flip.turn("next");
    }
  });
});
</script>
